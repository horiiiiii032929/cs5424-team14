name: cs5424-hikaru
x-db: &db
  image: cs5424-citus-native:14.1.0-pg18.6
  environment:
    POSTGRES_HOST_AUTH_METHOD: trust
  shm_size: 512mb
  command: [postgres, -c, shared_preload_libraries=citus, -c, shared_buffers=256MB, -c, default_transaction_isolation=serializable, -c, citus.enable_repartition_joins=on]
  volumes:
    - .:/workspace
  healthcheck:
    test: [CMD-SHELL, pg_isready -h localhost -U postgres]
    interval: 2s
    timeout: 2s
    retries: 30
services:
  coordinator:
    <<: *db
    build:
      context: ./docker
    hostname: coordinator
  worker1:
    <<: *db
    hostname: worker1
  worker2:
    <<: *db
    hostname: worker2
  worker3:
    <<: *db
    hostname: worker3
  worker4:
    <<: *db
    hostname: worker4
